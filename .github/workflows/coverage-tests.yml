name: Coverage regression tests
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config.json"
      - "docs/app.js"
      - "docs/sw.js"
      - "docs/styles.css"
      - ".github/workflows/coverage-tests.yml"
  push:
    branches: ["coverage-hardening-20261124", "story-context-phase1", "adaptive-context-discovery", "context-regression-repair", "restore-refresh-and-context"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config.json"
      - "docs/app.js"
      - "docs/sw.js"
      - "docs/styles.css"
      - ".github/workflows/coverage-tests.yml"
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser numpy requests beautifulsoup4 python-dateutil scikit-learn
      - run: node --check docs/app.js && node --check docs/sw.js
      - run: python -m py_compile scripts/update_news.py
      - run: python -m unittest discover -s tests -v
