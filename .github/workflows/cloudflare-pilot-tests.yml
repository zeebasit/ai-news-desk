name: Cloudflare watchdog pilot tests
on:
  push:
    branches: [cloudflare-watchdog-pilot]
    paths:
      - "cloudflare/watchdog/**"
      - ".github/workflows/cloudflare-pilot-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test cloudflare/watchdog/worker.test.mjs
