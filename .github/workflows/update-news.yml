name: Update curated news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - "watchlist.json"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache semantic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and rank
        run: python scripts/update_news.py
      - name: Commit changed data
        run: |
          if git diff --quiet docs/data/news.json; then exit 0; fi
          git config user.name "ai-news-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          git commit -m "chore: refresh curated news"
          git pull --rebase origin main
          git push origin HEAD:main
