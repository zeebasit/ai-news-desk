name: Update curated news
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - "watchlist.json"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Validate collector syntax
        run: python -m py_compile scripts/update_news.py
      - name: Cache semantic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - name: Install CPU inference runtime
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate scoring helpers
        run: |
          python - <<'PY'
          from datetime import timedelta
          import scripts.update_news as n

          pts,reasons=n.generic_quantified_signals("Company market value climbs by almost $1tn")
          assert "major market-value change" in reasons and pts >= 18, (pts,reasons)

          now=n.NOW.isoformat()
          group=[
              {"source":"Reuters","published_at":now},
              {"source":"AP News","published_at":now},
          ]
          pts,reasons,trusted=n.cluster_consensus_evidence(group)
          assert len(trusted)==2
          assert abs(pts-float(n.EW.get("trusted_source_consensus",5))) < 0.01, pts

          prev_at=(n.NOW-timedelta(hours=1)).isoformat()
          previous={
              "generated_at":prev_at,
              "stories":[{
                  "id":"test-event","title":"Test event expands","summary":"",
                  "category":"World","importance":"Notable","score":40,
                  "published_at":prev_at,"source_count":1,
                  "reasons":[],"sources":[{"name":"Reuters"}],
                  "first_reported_at":prev_at,"update_count":0,
                  "coverage_history":[{"at":prev_at,"source_count":1}],
              }]
          }
          payload={
              "generated_at":now,
              "stories":[{
                  "id":"new-id","title":"Test event expands","summary":"",
                  "category":"World","importance":"Notable","score":40,
                  "published_at":now,"source_count":3,
                  "reasons":[],"sources":[{"name":"Reuters"},{"name":"AP News"},{"name":"BBC"}],
              }]
          }
          result=n.apply_continuity(payload,previous)["stories"][0]
          assert result.get("coverage_momentum",{}).get("new_sources")==2, result
          assert result["score"]>40, result

          rewritten_old={
              "id":"rewrite-test","title":"Aurelia Systems value jumps after Mira Chen returns as CEO",
              "summary":"","category":"Tech","published_at":prev_at,
              "first_reported_at":prev_at,"sources":[{"name":"Reuters"},{"name":"BBC"}],
          }
          rewritten_new={
              "id":"other","title":"Why Aurelia reinstated Mira Chen as chief executive",
              "summary":"","category":"Tech","published_at":now,
              "sources":[{"name":"Reuters"},{"name":"BBC"},{"name":"AP News"}],
          }
          assert n.match_previous_story(rewritten_new,[rewritten_old]) is rewritten_old
          PY
      - name: Run collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect and rank
        run: python scripts/update_news.py
      - name: Commit changed data
        run: |
          if git diff --quiet docs/data/news.json; then exit 0; fi
          git config user.name "ai-news-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          git commit -m "chore: refresh curated news"
          git pull --rebase origin main
          git push origin HEAD:main
